<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('LaptopGG · 노트북 추천')}"></head>
<body class="app-body page-recommend-form">
<header th:replace="~{fragments/layout :: siteHeader}"></header>
<main id="main-content" tabindex="-1" class="page-shell recommend-shell">
    <section class="hero-copy">
        <p class="eyebrow">나에게 맞는 노트북 찾기</p>
        <h1 class="hero-title">어떤 노트북을 찾으세요?</h1>
        <p class="hero-lead">예산과 사용 목적을 알려주세요. 복잡한 사양은 함께 살펴볼게요.</p>
    </section>
    <section class="curation-panel" aria-label="추천 조건 입력">
        <form th:action="@{/recommends}" th:object="${laptopRecommendationRequest}" method="post" class="curation-form">
            <div class="input-grid">
                <div class="field-block">
                    <label for="budget" class="field-label">예산 <span class="field-unit">원</span></label>
                    <p class="field-hint" id="budgetHint">직접 입력하거나 빠르게 선택하세요.</p>
                    <input type="number" class="form-control" min="1" max="10000000" step="1" id="budget" th:field="*{budget}" required aria-describedby="budgetHint budgetToggleValue" inputmode="numeric">
                    <div class="preset-dropdown-pills" id="budgetPresetMenu" aria-label="예산 빠른 선택">
                        <button type="button" class="preset-dropdown-pill" th:each="preset : ${recommendationPage.budgetPresetList}" th:attr="data-value=${preset}" th:text="${#numbers.formatInteger(preset / 10000, 1, 'COMMA') + '만원'}"></button>
                    </div>
                    <p class="field-note" id="budgetToggleValue" aria-live="polite"></p>
                </div>
                <div class="field-block">
                    <label for="weight" class="field-label">최대 무게 <span class="field-unit">kg</span></label>
                    <p class="field-hint" id="weightHint">가지고 다닐 무게를 고려해 주세요.</p>
                    <input type="number" class="form-control" min="0.1" max="10" step="0.1" id="weight" th:field="*{maxWeightKg}" required aria-describedby="weightHint weightToggleValue" inputmode="decimal">
                    <div class="preset-dropdown-pills" id="weightPresetMenu" aria-label="무게 빠른 선택">
                        <button type="button" class="preset-dropdown-pill" th:each="preset : ${recommendationPage.weightPresetList}" th:attr="data-value=${preset}" th:text="${#numbers.formatDecimal(preset, 1, 1) + 'kg'}"></button>
                    </div>
                    <p class="field-note" id="weightToggleValue" aria-live="polite"></p>
                </div>
            </div>
            <fieldset class="field-block">
                <legend class="field-label">원하는 화면 크기</legend>
                <p class="field-hint">잘 모르겠다면 그대로 두셔도 괜찮아요.</p>
                <div class="mode-chip-grid">
                    <label class="mode-chip" th:each="option : ${recommendationPage.screenSizeModeOptions}">
                        <input type="radio" th:id="${'screenSizeMode_' + option.value}" name="screenSizeMode" th:value="${option.value}" th:checked="${recommendationPage.laptopRecommendationRequest.resolvedScreenSizeMode() == option.value}">
                        <span><strong th:text="${option.label}"></strong><small th:text="${option.description}"></small></span>
                    </label>
                </div>
                <div class="size-chip-grid" id="screenSizeGrid">
                    <label class="size-chip" th:each="screenSize : ${recommendationPage.screenSizeList}">
                        <input type="checkbox" th:id="${'screenSize_' + screenSize}" th:field="*{screenSizes}" th:value="${screenSize}">
                        <span th:text="${screenSize + '형'}"></span>
                    </label>
                </div>
                <p id="screenSizeSelectionSummary" class="field-note" aria-live="polite"></p>
            </fieldset>
            <fieldset class="field-block">
                <legend class="field-label">주로 어떤 용도로 쓰시나요?</legend>
                <p class="field-hint">가장 자주 할 작업을 하나 선택하세요.</p>
                <div class="usecase-card-grid">
                    <label class="usecase-card" th:each="option : ${recommendationPage.useCaseOptions}">
                        <input type="radio" th:id="${'useCase_' + option.value}" name="useCase" th:value="${option.value}" th:checked="${recommendationPage.laptopRecommendationRequest.resolvedUseCase() == option.value}">
                        <span><strong th:text="${option.label}"></strong><small th:text="${option.description}"></small></span>
                    </label>
                </div>
            </fieldset>
            <div class="action-row">
                <button type="submit" class="primary-button">추천받기</button>
                <a href="/recommends" class="secondary-button">조건 초기화</a>
            </div>
        </form>
    </section>
</main>
<script defer th:src="@{/recommendation-form.js}"></script>
</body>
</html>
