# Include at the end of sshd_config so this Match block cannot affect global directives.
Match User laptopgg-backup
    AuthorizedKeysFile /etc/ssh/authorized_keys/laptopgg-backup
    ChrootDirectory /var/backups/laptopgg-replica
    ForceCommand internal-sftp -d /archives -u 0077 -p open,close,write,lstat,fstat,stat,realpath,setstat,fsetstat,fsync,limits,rename,posix-rename
    AuthenticationMethods publickey
    PasswordAuthentication no
    DisableForwarding yes
    PermitTTY no
