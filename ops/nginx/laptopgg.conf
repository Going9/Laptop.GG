server {
    listen 80;
    server_name laptopgg.com www.laptopgg.com;
    include /etc/nginx/snippets/laptopgg-headers.conf;

    access_log /var/log/nginx/laptopgg.access.log combined;
    error_log /var/log/nginx/laptopgg.error.log warn;

    location ^~ /actuator/ {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/snippets/laptopgg-proxy.conf;
    }

    location ^~ /api/crawl/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/laptopgg-proxy.conf;
    }
}
