name: UI Full

on:
  workflow_call:

jobs:
  full:
    name: UI Full
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Full UI checks against isolated H2 server
        run: npm run test:ui:full
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-full-${{ github.run_id }}
          path: output/ui/
          retention-days: 14
