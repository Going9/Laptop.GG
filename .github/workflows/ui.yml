name: UI Checks

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

jobs:
  full:
    name: UI Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Representative UI checks against isolated H2 server
        if: ${{ !inputs.full }}
        run: npm run test:ui:check
      - name: Extended Full UI checks
        if: inputs.full
        run: npm run test:ui:full
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-checks-${{ github.run_id }}
          path: output/ui/
          retention-days: 14
